apiVersion: v1
kind: Pod
metadata:
  name: lab3-prestop-sigterm
spec:
  terminationGracePeriodSeconds: 10
  volumes: 
    - name: host-logs
      hostPath:
        path: /var/log/
        type: DirectoryOrCreate
  containers:
  - name: app
    image: busybox
    volumeMounts:
      - name: host-logs
        mountPath:  /prestoplogs
    lifecycle: 
      preStop:
        exec:
          command:
            - sh
            - -c
            - |
              echo PRESTOP START $(date) >> /prestoplogs/prestop.log
              sleep 6
              echo PRESTOP END $(date) >> /prestoplogs/prestop.log
    command:
      - sh
      - -c
      - |
        echo "START $(date)"

        trap 'echo "SIGTERM RECEIVED $(date)"; sleep 2; echo "EXITING CLEANLY $(date)"; exit 0' TERM

        while true; do
          echo "RUNNING $(date)"
          sleep 1
        done