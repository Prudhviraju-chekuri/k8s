apiVersion: v1
kind: Pod
metadata:
  name: lab5-timeline
spec:
  terminationGracePeriodSeconds: 10
  containers:
  - name: app
    image: busybox
    command:
      - sh
      - -c
      - |
        echo "START $(date)"

        trap 'echo "SIGTERM RECEIVED $(date)"; sleep 8; echo "EXITING CLEANLY $(date)"; exit 0' TERM

        while true; do
          echo "RUNNING $(date)"
          sleep 1
        done

# Verify

# Compare:

# delete time
# SIGTERM time
# exit time

# You will see:

# SIGTERM almost immediately
# exit within grace period 