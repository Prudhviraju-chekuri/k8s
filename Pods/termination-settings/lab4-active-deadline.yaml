apiVersion: v1
kind: Pod
metadata:
  name: lab4-deadline
spec:
  terminationGracePeriodSeconds: 5
  activeDeadlineSeconds:  15
  containers:
  - name: app
    image: busybox
    command:
      - sh
      - -c
      - |
        echo "START $(date)"

        trap 'echo "SIGTERM RECEIVED $(date)"; sleep 3; echo "EXITING CLEANLY $(date)"; exit 0' TERM

        while true; do
          echo "RUNNING $(date)"
          sleep 2
        done