apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
spec:
  selector:
    matchLabels:
      app: fluentbit
  template:
    metadata:
      labels:
        app: fluentbit
    spec:
      containers:
      - name: fluentbit
        image: fluent/fluent-bit:2.2
        volumeMounts:

        - name: varlog
          mountPath: /var/log

        - name: config
          mountPath: /fluent-bit/etc/

      volumes:

      - name: varlog
        hostPath:
          path: /var/log

      - name: config
        configMap:
          name: fluent-bit-config