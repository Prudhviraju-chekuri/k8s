apiVersion: v1
kind: Pod
metadata:
  name: toleration-pod
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
              - login-app
          topologyKey: "kubernetes.io/hostname"
  containers:
    - name: nginx
      image: nginx